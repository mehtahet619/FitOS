name: Regenerate backend npm lockfile

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/regenerate-backend-lockfile.yml"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Synchronize lockfile
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        run: |
          if git diff --quiet -- backend/package-lock.json; then
            echo "Lockfile is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json
          git commit -m "fix: synchronize backend npm lockfile"
          git push origin HEAD:main
