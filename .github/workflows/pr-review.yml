name: PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  security-events: write
  checks: read

jobs:
  frontend-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22.14.0 }
      - name: Check frontend JavaScript syntax
        run: |
          node --check frontend/analytics.js
          node --check frontend/api.js
          node --check frontend/config.js
          node --check scripts/inject-frontend-api-url.cjs

  lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22.14.0, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm run lint

  typecheck:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22.14.0, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck

  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22.14.0, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm test

  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22.14.0, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm run build

  codeql:
    if: github.event_name == 'pull_request'
    name: codeql
    runs-on: ubuntu-latest
    permissions: { actions: read, contents: read, security-events: write }
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with: { languages: javascript-typescript }
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
        with:
          upload: false

  secretlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22.14.0, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm run secretlint

  suggestions:
    if: always() && github.event_name == 'pull_request' && needs.lint.result == 'failure'
    needs: [lint]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with: { node-version: 22.14.0, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - name: Post mechanical ESLint suggestions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_SHA: ${{ github.event.pull_request.head.sha }}
        run: node ../scripts/post-eslint-suggestions.mjs

  danger:
    if: always() && github.event_name == 'pull_request'
    needs: [lint, typecheck, test, build, codeql, secretlint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22.14.0, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci --prefix backend --include=dev
      - run: ./node_modules/.bin/danger ci --dangerfile ../dangerfile.ts
        working-directory: backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  auto-merge:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.pull_request.user.login == 'mehtahet619' && needs.danger.result == 'success'
    needs: [lint, typecheck, test, build, codeql, secretlint, danger]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Check sensitive paths and unresolved threads
        id: policy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          changed=$(gh pr view "$PR_NUMBER" --json files --jq '.files[].path')
          sensitive=false
          while IFS= read -r file; do
            node scripts/is-sensitive-path.mjs "$file" && sensitive=true
          done <<< "$changed"

          unresolved=$(gh api graphql --paginate -f query='query($owner:String!,$repo:String!,$number:Int!,$endCursor:String){repository(owner:$owner,name:$repo){pullRequest(number:$number){reviewThreads(first:100,after:$endCursor){nodes{isResolved}pageInfo{hasNextPage endCursor}}}}}' -F owner='${{ github.repository_owner }}' -F repo='${{ github.event.repository.name }}' -F number="$PR_NUMBER" --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length' | awk '{s+=$1} END{print s+0}')

          echo "sensitive=$sensitive" >> "$GITHUB_OUTPUT"
          echo "unresolved=$unresolved" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge
        if: steps.policy.outputs.sensitive == 'false' && steps.policy.outputs.unresolved == '0'
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pull-request-number: ${{ github.event.pull_request.number }}
          merge-method: squash

  override-review:
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request != null && contains(github.event.comment.body, '/override-review')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify maintainer and log override
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          node scripts/is-maintainer.mjs "$COMMENT_AUTHOR" || { echo "Not an approved maintainer"; exit 1; }
          echo "Manual review override by $COMMENT_AUTHOR for PR #$PR_NUMBER" >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "$PR_NUMBER" --body "Review override recorded for @$COMMENT_AUTHOR. This is a maintainer-approved exception; automated checks remain visible in the PR."
          gh pr merge "$PR_NUMBER" --squash --admin

  security-policy:
    if: github.event_name == 'pull_request'
    name: security-policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Block changes to CI and security enforcement files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          protected='^(
            \.github/workflows/|
            \.github/CODEOWNERS$|
            \.github/review-policy\.yml$|
            scripts/is-sensitive-path\.mjs$|
            scripts/is-maintainer\.mjs$|
            dangerfile\.ts$
          )'
          if printf '%s\\n' "$changed" | grep -E "$protected" >/dev/null; then
            echo "::error::This PR changes CI/workflow or security-policy files. Such changes are blocked and require a separate, explicitly authorized security-policy change."
            printf '%s\\n' "$changed" | grep -E "$protected"
            exit 1
          fi
          echo "No protected CI/security-policy files changed."
