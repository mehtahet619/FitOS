name: Crowd model (nightly)

on:
  schedule: [{ cron: "30 20 * * *" }]   # 02:00 IST
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  train-and-publish:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ml/crowd } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: ml/crowd/requirements.txt }
      - run: pip install -r requirements.txt
      - run: pytest -q tests
      - run: python pipeline.py
        env:
          FITOS_API_URL: ${{ secrets.FITOS_API_URL }}
          GYM_ML_PIPELINE_KEY: ${{ secrets.GYM_ML_PIPELINE_KEY }}
