services:
  - type: web
    name: adaptive-fit-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm run migrate:mysql:prod && npm start
    autoDeploy: false
    healthCheckPath: /health
    plan: free
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: OTP_HASH_SECRET
        generateValue: true
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_REQUIRE_MX
        value: "false"
      - key: FRONTEND_ORIGIN
        value: https://adaptive-fit-web.onrender.com
      - key: RENDER_SERVICE_ID
        value: adaptive-fit-web
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openrouter/auto
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
      - key: EQUIPMENT_MODE
        value: SCANNED
      - key: EQUIPMENT_VISION_MODEL_PATH
        value: /opt/render/project/src/backend/models/best.onnx
      - key: EQUIPMENT_VISION_PYTHON
        value: python3
      - key: EQUIPMENT_DETECTION_CONFIDENCE_THRESHOLD
        value: "0.50"
      - key: ROBOFLOW_WORKFLOW_MODE
        value: "true"
      - key: ROBOFLOW_API_KEY
        sync: false
      - key: MAPS_PROVIDER
        value: apify_swiggy
      - key: APIFY_API_KEY
        sync: false

  - type: web
    name: adaptive-fit-web
    runtime: static
    buildCommand: node scripts/inject-frontend-api-url.cjs
    staticPublishPath: frontend
    autoDeploy: false
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /login
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /register
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /verify-email
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /verify-login
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /forgot-password
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /reset-password
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /homepage
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /today
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /workout
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /workouts
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /nutrition
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /equipment
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /history
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /profile
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /settings
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /gym
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /scan
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /vision
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /diet
        name: X-Robots-Tag
        value: noindex, nofollow
    routes:
      - type: rewrite
        source: /terms
        destination: /terms.html
      - type: rewrite
        source: /privacy
        destination: /privacy.html
      - type: rewrite
        source: /404
        destination: /404.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: API_BASE_URL
        value: https://adaptive-fit-api.onrender.com
      # If a custom domain is configured, keep this and backend FRONTEND_ORIGIN aligned with it.
      - key: PUBLIC_SITE_URL
        value: https://adaptive-fit-web.onrender.com
      - key: GA4_MEASUREMENT_ID
        sync: false
      - key: CLARITY_PROJECT_ID
        sync: false
