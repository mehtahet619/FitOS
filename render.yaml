services:
  - type: web
    name: adaptive-fit-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run migrate:postgres:prod
    startCommand: npm start
    autoDeploy: false
    healthCheckPath: /health
    plan: free
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: DATABASE_URL
        fromDatabase:
          name: adaptive-fit-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: OTP_HASH_SECRET
        generateValue: true
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_REQUIRE_MX
        value: "false"
      - key: FRONTEND_ORIGIN
        value: https://adaptive-fit-web.onrender.com
      - key: RENDER_SERVICE_ID
        value: adaptive-fit-web
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_API_KEY
        sync: false
      - key: EQUIPMENT_MODE
        value: FULL_GYM
      - key: EQUIPMENT_VISION_API_URL
        value: https://serverless.roboflow.com
      - key: EQUIPMENT_VISION_MODEL_ID
        value: all-gym-equipment/2
      - key: EQUIPMENT_VISION_API_KEY
        sync: false
      - key: EQUIPMENT_DETECTION_CONFIDENCE_THRESHOLD
        value: "0.50"
      - key: MAPS_PROVIDER
        value: apify_swiggy
      - key: APIFY_API_KEY
        sync: false

  - type: web
    name: adaptive-fit-web
    runtime: static
    buildCommand: node scripts/inject-frontend-api-url.js
    staticPublishPath: frontend
    autoDeploy: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: API_BASE_URL
        value: https://adaptive-fit-api.onrender.com

databases:
  - name: adaptive-fit-db
    databaseName: adaptive_fit
    user: adaptive_fit
    plan: free
