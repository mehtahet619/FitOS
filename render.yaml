services:
  - type: web
    name: adaptive-fit-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm run migrate:postgres && npm run seed && npm start
    healthCheckPath: /health
    plan: starter
    envVars:
      - key: NODE_VERSION
        value: 22.5.0
      - key: DATABASE_URL
        fromDatabase:
          name: adaptive-fit-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://adaptive-fit-web.onrender.com
      - key: AI_PROVIDER
        value: template
      - key: MAPS_PROVIDER
        value: mock

  - type: static_site
    name: adaptive-fit-web
    buildCommand: echo "No frontend build required"
    staticPublishPath: frontend

databases:
  - name: adaptive-fit-db
    databaseName: adaptive_fit
    user: adaptive_fit
    plan: free